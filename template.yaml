AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:

  TasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Handler: bootstrap
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
      Environment:
        Variables:
          TASKS_TABLE_NAME: !Ref TasksTable
      Events:
        GetTasks:
          Type: HttpApi
          Properties:
            Path: /tasks
            Method: GET
        
        CreateTask:
          Type: HttpApi
          Properties:
            Path: /tasks
            Method: POST
        
        GetTask:
          Type: HttpApi
          Properties:
            Path: /tasks/{id}
            Method: GET
        
        UpdateTask:
          Type: HttpApi
          Properties:
            Path: /tasks/{id}
            Method: PUT
      
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH