name: dev
variables:
  - name: baseUrl
    value: YOUR_API_URL
    description: Base URL of the deployed HTTP API
  - name: region
    value: YOUR_AWS_REGION
    description: AWS region of the Cognito user pool
  - name: clientId
    value: YOUR_COGNITO_CLIENT_ID
    description: Cognito app client ID
  - name: taskId
    value: YOUR_TASK_ID
    description: ULID of an existing task
  - secret: true
    name: username
  - secret: true
    name: password
