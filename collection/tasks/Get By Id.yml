info:
  name: Get By Id
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/tasks/:id"
  params:
    - name: id
      value: "{{taskId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
